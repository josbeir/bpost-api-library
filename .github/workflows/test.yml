on:
  push:
  pull_request:

jobs:
  php-cs-fixer:
    name: PHP-CS-Fixer
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Install composer dependencies
        uses: ramsey/composer-install@v3

      - name: PHP-CS-Fixer static analysis
        run: vendor/bin/php-cs-fixer fix --using-cache=no --diff --dry-run -v

  tests:
    name: PHP ${{ matrix.php }} — PHPUnit ${{ matrix.dependencies }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.1'
          - '8.2'
          - '8.3'
          - '8.4'
        dependencies:
          - highest
        include:
          - php: '8.4'
            dependencies: lowest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2

      - name: Install composer dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: PHPUnit Tests
        run: vendor/bin/phpunit